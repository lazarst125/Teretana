<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teretana — rezervacija termina</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="preskoci-na-sadrzaj" href="#sadrzaj">Preskoči na sadržaj</a>

  <header class="zaglavlje">
    <p class="naziv-aplikacije">Teretana</p>
  </header>

  <main id="sadrzaj" class="sadrzaj" tabindex="-1">
    <h1>Rezervacija termina u teretani</h1>
    <p>Pregled termina, rezervacije i lista čekanja za članove i trenere.</p>
  </main>

  <footer class="podnozje">
    <section class="status-sistema" aria-labelledby="status-sistema-naslov">
      <h2 id="status-sistema-naslov">Status sistema</h2>
      <button id="status-sistema-proveri" type="button" data-testid="status-sistema-proveri">Proveri</button>
      <p id="status-sistema-rezultat" data-testid="status-sistema-rezultat" role="status" aria-live="polite"></p>
    </section>
  </footer>
</body>
</html>
